name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Local App Studio is local-first: features that need an account, a hosted service or sending data
        off your computer are unlikely to fit. Features that belong to the pro half (the helper, Make installer,
        licensing, the cloud provider) are not built in this repository.
        Security problems do not go here. Read SECURITY.md.
