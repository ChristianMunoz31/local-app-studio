# las-workflow-set: public
name: Desktop check

# Rust checks for the Tauri shell in src-tauri: rustfmt, clippy (warnings are errors) and unit tests.
# Manual only (workflow_dispatch): a cold run takes about 12 to 15 minutes. It is a public build: no pro code, no
# secret and no token beyond the read-only GITHUB_TOKEN. Linux only; Windows and macOS are not built here.
# ubuntu-22.04 is what the Tauri v2 prerequisites page documents (webkit2gtk-4.1 is available there).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust (stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # tauri-build checks that the sidecar and bundled resources exist, even for cargo check and test.
      # Empty stand-ins are enough here.
      - name: Create placeholder sidecar and resources
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries src-tauri/resources/dist
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/local-app-studio-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/local-app-studio-server-x86_64-unknown-linux-gnu
          echo '<!doctype html><title>placeholder</title>' > src-tauri/resources/dist/index.html
          rm -rf src-tauri/resources/migrations
          cp -r server/db/migrations src-tauri/resources/migrations
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test --locked
